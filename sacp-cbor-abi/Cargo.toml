[package]
name = "sacp-cbor-abi"
version = "0.6.3"
edition = "2021"
rust-version = "1.75"
license = "MIT"
description = "Stable ABI schema and codegen layer for sacp-cbor"
readme = "README.md"
repository = "https://github.com/Synext-Solution/sacp-cbor"

[features]
default = ["derive"]
derive = ["dep:sacp-cbor-abi-derive"]

[dependencies]
sacp-cbor = { path = "..", version = "0.17.6", default-features = false, features = ["alloc"] }
sacp-cbor-abi-derive = { path = "../sacp-cbor-abi-derive", version = "0.3.0", optional = true }
sha2 = { version = "0.10", default-features = false }

[dev-dependencies]
trybuild = "1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }
