[package]
name = "sacp-cbor-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
serde = { version = "1", features = ["derive"] }
sacp-cbor = { path = "..", default-features = false, features = ["std", "derive", "collections", "edit", "serde", "sha2", "cde"] }
sacp-cbor-schema = { path = "../sacp-cbor-schema" }

[[bin]]
name = "validate_only"
path = "fuzz_targets/validate_only.rs"
test = false
doc = false

[[bin]]
name = "validate_roundtrip"
path = "fuzz_targets/validate_roundtrip.rs"
test = false
doc = false

[[bin]]
name = "query_only"
path = "fuzz_targets/query_only.rs"
test = false
doc = false

[[bin]]
name = "decode_ignored"
path = "fuzz_targets/decode_ignored.rs"
test = false
doc = false

[[bin]]
name = "serde_from_slice"
path = "fuzz_targets/serde_from_slice.rs"
test = false
doc = false

[[bin]]
name = "edit_noop"
path = "fuzz_targets/edit_noop.rs"
test = false
doc = false

[[bin]]
name = "schema_check"
path = "fuzz_targets/schema_check.rs"
test = false
doc = false

[[bin]]
name = "cde_bridge"
path = "fuzz_targets/cde_bridge.rs"
test = false
doc = false

[workspace]
members = ["."]
