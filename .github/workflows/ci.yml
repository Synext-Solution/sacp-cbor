name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install Rust 1.85.0
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable, 2026-08-24
        with:
          toolchain: "1.85.0"

      - name: Install Rust 1.75.0 for proc-macro MSRV verification
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable, 2026-08-24
        with:
          toolchain: "1.75.0"

      - name: Check every published package at its runtime MSRV
        env:
          RUSTFLAGS: -D warnings
        run: |
          cargo +1.85.0 check --locked -p sacp-cbor --no-default-features
          cargo +1.85.0 check --locked -p sacp-cbor --no-default-features --features sha2
          cargo +1.85.0 check --locked -p sacp-cbor --no-default-features --features alloc
          cargo +1.85.0 check --locked -p sacp-cbor --all-features
          cargo +1.75.0 check --locked -p sacp-cbor-derive
          cargo +1.85.0 check --locked -p sacp-cbor-abi --no-default-features
          cargo +1.85.0 check --locked -p sacp-cbor-abi
          cargo +1.75.0 check --locked -p sacp-cbor-abi-derive
          cargo +1.85.0 check --locked -p sacp-cbor-schema --no-default-features
          cargo +1.85.0 check --locked -p sacp-cbor-schema

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Shellcheck
        uses: ludeeus/action-shellcheck@00b27aa7cb85167568cb48a3838b75f4265f2bca # master, 2026-08-24
        with:
          scandir: scripts

      - name: Install Rust 1.97.1
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable, 2026-08-24
        with:
          toolchain: "1.97.1"
          components: rustfmt, clippy

      - name: Verify production dependency DAG
        run: |
          python3 -m unittest discover -s scripts/tests -p 'test_*.py'
          python3 scripts/check_package_dag.py

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy (all features)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Tests (default features)
        run: cargo test --workspace

      - name: Tests (all features)
        run: cargo test --workspace --all-features

      - name: Build (no default features)
        run: cargo build -p sacp-cbor --no-default-features

      - name: Build (no_std + alloc)
        run: cargo build -p sacp-cbor --no-default-features --features alloc

      - name: Build (no_std + alloc + collections)
        run: cargo build -p sacp-cbor --no-default-features --features collections

      - name: Build (no_std + alloc + edit)
        run: cargo build -p sacp-cbor --no-default-features --features edit

      - name: Build (no_std + alloc + cde)
        run: cargo build -p sacp-cbor --no-default-features --features cde

      - name: Build (no_std + alloc + serde)
        run: cargo build -p sacp-cbor --no-default-features --features serde

      - name: Build (no_std + alloc + derive)
        run: cargo build -p sacp-cbor --no-default-features --features derive

      - name: Build (no_std + alloc + sha2)
        run: cargo build -p sacp-cbor --no-default-features --features alloc,sha2

      - name: Build (no_std + sha2 helpers only)
        run: cargo build -p sacp-cbor --no-default-features --features sha2

      - name: Build ABI (no default features)
        run: cargo build -p sacp-cbor-abi --no-default-features

      - name: Build schema (no default features)
        run: cargo build -p sacp-cbor-schema --no-default-features

      - name: Package all publishable crates
        run: cargo package --workspace --locked

      - name: Consume the packaged tarballs
        run: python3 scripts/package_consumer_smoke.py

      - name: Docs
        run: cargo doc --workspace --no-deps --all-features

  fuzz-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install pinned nightly
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable, 2026-08-24
        with:
          toolchain: nightly-2026-08-01

      - name: Install cargo-fuzz 0.13.2
        run: cargo install cargo-fuzz --locked --version 0.13.2

      - name: Build every fuzz target
        working-directory: fuzz
        run: cargo fuzz build

  bench-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install Rust 1.97.1
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable, 2026-08-24
        with:
          toolchain: "1.97.1"
          components: rustfmt, clippy

      - name: Fetch datasets
        run: ./benchmarks/scripts/fetch_datasets.sh

      - name: Format (bench harness)
        working-directory: benchmarks
        run: cargo fmt --all -- --check

      - name: Clippy (bench harness)
        working-directory: benchmarks
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Bench smoke run
        working-directory: benchmarks
        env:
          BENCH_FAST: "1"
        run: cargo bench

      - name: Generate report
        working-directory: benchmarks
        run: cargo run -p bench_harness --bin report

      - name: Upload bench report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: bench-report
          path: benchmarks/reports/latest/

  kani:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install Rust 1.97.1
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable, 2026-08-24
        with:
          toolchain: "1.97.1"

      - name: Install Kani 0.67.0
        run: |
          cargo install kani-verifier --locked --version 0.67.0
          cargo kani setup

      - name: Run core and ABI Kani proofs
        run: ./scripts/proof.sh

  miri:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install pinned nightly with Miri
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable, 2026-08-24
        with:
          toolchain: nightly-2026-08-01
          components: miri

      - name: Miri unsafe-feature query smoke
        run: cargo miri test --no-default-features --features unsafe --test query unsafe_value_ref_malformed_ranges_return_query_errors
