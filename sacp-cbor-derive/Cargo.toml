[package]
name = "sacp-cbor-derive"
version = "0.17.2"
edition = "2021"
license = "MIT"
description = "Derive macros for sacp-cbor native encode/decode"
repository = "https://github.com/Synext-Solution/sacp-cbor"

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full", "extra-traits"] }
