[package]
name = "sacp-cbor-schema"
version = "0.2.1"
edition = "2021"
rust-version = "1.85"
license = "MIT"
description = "Closed-record schema validation for canonical SACP-CBOR/1 values"
readme = "README.md"
repository = "https://github.com/Synext-Solution/sacp-cbor"

[dependencies]
sacp-cbor = { path = "..", version = "=0.18.1", default-features = false, features = ["alloc"] }

[features]
default = ["std"]
std = ["sacp-cbor/std"]

[dev-dependencies]
proptest = "1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }

[[bench]]
name = "validate"
harness = false
