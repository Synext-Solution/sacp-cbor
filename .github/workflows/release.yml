name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Exact sacp-cbor version to publish from main"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  preflight:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Shellcheck
        uses: ludeeus/action-shellcheck@00b27aa7cb85167568cb48a3838b75f4265f2bca # master, 2026-08-24
        with:
          scandir: scripts

      - name: Install Rust 1.85.0 for MSRV verification
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable, 2026-08-24
        with:
          toolchain: "1.85.0"

      - name: Install Rust 1.75.0 for proc-macro MSRV verification
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable, 2026-08-24
        with:
          toolchain: "1.75.0"

      - name: Install Rust 1.97.1
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable, 2026-08-24
        with:
          toolchain: "1.97.1"
          components: rustfmt, clippy

      - name: Verify every published package at its runtime MSRV
        env:
          RUSTFLAGS: -D warnings
        run: |
          cargo +1.85.0 check --locked -p sacp-cbor --no-default-features
          cargo +1.85.0 check --locked -p sacp-cbor --no-default-features --features sha2
          cargo +1.85.0 check --locked -p sacp-cbor --no-default-features --features alloc
          cargo +1.85.0 check --locked -p sacp-cbor --all-features
          cargo +1.75.0 check --locked -p sacp-cbor-derive
          cargo +1.85.0 check --locked -p sacp-cbor-abi --no-default-features
          cargo +1.85.0 check --locked -p sacp-cbor-abi
          cargo +1.75.0 check --locked -p sacp-cbor-abi-derive
          cargo +1.85.0 check --locked -p sacp-cbor-schema --no-default-features
          cargo +1.85.0 check --locked -p sacp-cbor-schema

      - name: Verify release metadata
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: scripts/release.sh --metadata-only

      - name: Verify production dependency DAG
        run: |
          python3 -m unittest discover -s scripts/tests -p 'test_*.py'
          python3 scripts/check_package_dag.py

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy (all features)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Tests (default features)
        run: cargo test --workspace

      - name: Tests (all features)
        run: cargo test --workspace --all-features

      - name: Build publishable no-default-feature combinations
        run: |
          cargo build -p sacp-cbor --no-default-features
          cargo build -p sacp-cbor --no-default-features --features alloc
          cargo build -p sacp-cbor --no-default-features --features collections
          cargo build -p sacp-cbor --no-default-features --features edit
          cargo build -p sacp-cbor --no-default-features --features cde
          cargo build -p sacp-cbor --no-default-features --features serde
          cargo build -p sacp-cbor --no-default-features --features derive
          cargo build -p sacp-cbor --no-default-features --features alloc,sha2
          cargo build -p sacp-cbor --no-default-features --features sha2
          cargo build -p sacp-cbor-abi --no-default-features
          cargo build -p sacp-cbor-schema --no-default-features

      - name: Docs
        run: cargo doc --workspace --no-deps --all-features

      - name: Package all publishable crates
        run: cargo package --workspace --locked

      - name: Consume the packaged tarballs
        run: python3 scripts/package_consumer_smoke.py

  publish:
    needs: preflight
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Install Rust 1.97.1
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable, 2026-08-24
        with:
          toolchain: "1.97.1"

      - name: Package the exact release artifacts
        run: cargo package --workspace --locked

      - name: Publish five crates and create the annotated tag
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: scripts/release.sh
