name: CI

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Shellcheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: scripts

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy (all features)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Tests (default features)
        run: cargo test --workspace

      - name: Tests (all features)
        run: cargo test --workspace --all-features

      - name: Build (no default features)
        run: cargo build -p sacp-cbor --no-default-features

      - name: Build (no_std + alloc)
        run: cargo build -p sacp-cbor --no-default-features --features alloc

      - name: Build (no_std + alloc + collections)
        run: cargo build -p sacp-cbor --no-default-features --features collections

      - name: Build (no_std + alloc + edit)
        run: cargo build -p sacp-cbor --no-default-features --features edit

      - name: Build (no_std + alloc + serde)
        run: cargo build -p sacp-cbor --no-default-features --features serde

      - name: Build (no_std + alloc + derive)
        run: cargo build -p sacp-cbor --no-default-features --features derive

      - name: Build (no_std + alloc + sha2)
        run: cargo build -p sacp-cbor --no-default-features --features alloc,sha2

      - name: Build ABI (no default features)
        run: cargo build -p sacp-cbor-abi --no-default-features

      - name: Package derive crate
        run: cargo package -p sacp-cbor-derive --locked

      - name: Package ABI derive crate
        run: cargo package -p sacp-cbor-abi-derive --locked

      - name: Docs
        run: cargo doc --workspace --no-deps --all-features

  release:
    needs: [test, miri]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Publish to crates.io and tag
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          package_meta() {
            MANIFEST="$1" python3 -c 'import os, pathlib, tomllib; data=tomllib.loads(pathlib.Path(os.environ["MANIFEST"]).read_text()); pkg=data.get("package", {}); name=pkg.get("name"); version=pkg.get("version"); print("MISSING" if not name or not version else f"{name} {version}")'
          }

          dependency_version() {
            MANIFEST="$1" DEP="$2" python3 -c 'import os, pathlib, tomllib; data=tomllib.loads(pathlib.Path(os.environ["MANIFEST"]).read_text()); print(data["dependencies"][os.environ["DEP"]]["version"])'
          }

          meta="$(package_meta "Cargo.toml")"

          if [ "$meta" = "MISSING" ] || [ -z "${meta:-}" ]; then
            echo "Failed to parse package name/version from Cargo.toml" >&2
            exit 1
          fi
          crate="${meta%% *}"
          version="${meta#* }"
          if [ -z "${crate:-}" ] || [ -z "${version:-}" ] || [ "$crate" = "$version" ]; then
            echo "Malformed package metadata: '${meta}'" >&2
            exit 1
          fi

          tag="v${version}"
          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            echo "Tag ${tag} already exists."
            tag_exists=1
          else
            tag_exists=0
          fi

          is_published() {
            CRATE="$1" VERSION="$2" python3 -c $'import json, os, sys, urllib.request, urllib.error\ncrate=os.environ[\"CRATE\"]\nversion=os.environ[\"VERSION\"]\nurl=f\"https://crates.io/api/v1/crates/{crate}\"\ntry:\n    with urllib.request.urlopen(url, timeout=10) as resp:\n        data=json.load(resp)\nexcept urllib.error.HTTPError as exc:\n    if exc.code == 404:\n        sys.exit(1)\n    print(f\"Failed to query crates.io: {exc}\", file=sys.stderr)\n    sys.exit(2)\nexcept Exception as exc:\n    print(f\"Failed to query crates.io: {exc}\", file=sys.stderr)\n    sys.exit(2)\nversions={v.get(\"num\") for v in data.get(\"versions\", [])}\nsys.exit(0 if version in versions else 1)\n'
          }

          wait_for_published() {
            local crate="$1"
            local version="$2"
            for attempt in $(seq 1 30); do
              if is_published "$crate" "$version" && cargo info "${crate}@${version}" >/dev/null 2>&1; then
                return 0
              fi
              echo "Waiting for ${crate} ${version} to appear on crates.io (${attempt}/30)."
              sleep 10
            done
            echo "${crate} ${version} did not appear on crates.io in time." >&2
            return 1
          }

          derive_meta="$(package_meta "sacp-cbor-derive/Cargo.toml")"
          if [ "$derive_meta" = "MISSING" ] || [ -z "${derive_meta:-}" ]; then
            echo "Failed to parse package name/version from sacp-cbor-derive/Cargo.toml" >&2
            exit 1
          fi
          derive_crate="${derive_meta%% *}"
          derive_version="${derive_meta#* }"
          derive_dep_version="$(dependency_version "Cargo.toml" "sacp-cbor-derive")"
          if [ "$derive_crate" != "sacp-cbor-derive" ]; then
            echo "Unexpected derive crate name: ${derive_crate}" >&2
            exit 1
          fi
          if [ "$derive_version" != "$derive_dep_version" ]; then
            echo "sacp-cbor-derive package version (${derive_version}) does not match dependency version (${derive_dep_version})." >&2
            exit 1
          fi
          if [ "$derive_version" != "$version" ]; then
            echo "sacp-cbor-derive package version (${derive_version}) does not match root version (${version})." >&2
            exit 1
          fi

          abi_derive_meta="$(package_meta "sacp-cbor-abi-derive/Cargo.toml")"
          if [ "$abi_derive_meta" = "MISSING" ] || [ -z "${abi_derive_meta:-}" ]; then
            echo "Failed to parse package name/version from sacp-cbor-abi-derive/Cargo.toml" >&2
            exit 1
          fi
          abi_derive_crate="${abi_derive_meta%% *}"
          abi_derive_version="${abi_derive_meta#* }"
          abi_meta="$(package_meta "sacp-cbor-abi/Cargo.toml")"
          if [ "$abi_meta" = "MISSING" ] || [ -z "${abi_meta:-}" ]; then
            echo "Failed to parse package name/version from sacp-cbor-abi/Cargo.toml" >&2
            exit 1
          fi
          abi_crate="${abi_meta%% *}"
          abi_version="${abi_meta#* }"
          abi_root_dep_version="$(dependency_version "sacp-cbor-abi/Cargo.toml" "sacp-cbor")"
          abi_derive_dep_version="$(dependency_version "sacp-cbor-abi/Cargo.toml" "sacp-cbor-abi-derive")"

          if [ "$abi_root_dep_version" != "$version" ]; then
            echo "sacp-cbor-abi dependency on sacp-cbor (${abi_root_dep_version}) does not match root version (${version})." >&2
            exit 1
          fi
          if [ "$abi_derive_dep_version" != "$abi_derive_version" ]; then
            echo "sacp-cbor-abi-derive package version (${abi_derive_version}) does not match dependency version (${abi_derive_dep_version})." >&2
            exit 1
          fi

          publish_crate() {
            local crate="$1"
            local version="$2"
            local package="$3"
            local published

            set +e
            is_published "$crate" "$version"
            published=$?
            set -e
            if [ "$published" -gt 1 ]; then
              exit 1
            fi
            if [ "$published" -eq 0 ]; then
              echo "${crate} ${version} already on crates.io; skipping publish."
              return 0
            fi
            if [ -z "${CARGO_REGISTRY_TOKEN:-}" ]; then
              echo "CARGO_REGISTRY_TOKEN is not set; cannot publish ${crate} ${version}." >&2
              exit 1
            fi
            cargo publish -p "$package" --locked
            wait_for_published "$crate" "$version"
          }

          publish_crate "sacp-cbor-derive" "$derive_version" "sacp-cbor-derive"
          publish_crate "$crate" "$version" "sacp-cbor"
          publish_crate "$abi_derive_crate" "$abi_derive_version" "sacp-cbor-abi-derive"
          publish_crate "$abi_crate" "$abi_version" "sacp-cbor-abi"

          if [ "$tag_exists" -eq 0 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag "${tag}"
            git push origin "refs/tags/${tag}"
          fi

  miri:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (nightly + Miri)
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri

      - name: Miri unsafe-feature query smoke
        run: cargo miri test --no-default-features --features unsafe --test query unsafe_value_ref_malformed_ranges_return_query_errors
