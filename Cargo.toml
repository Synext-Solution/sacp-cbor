[package]
name = "sacp-cbor"
version = "0.15.0"
edition = "2021"
rust-version = "1.75"
license = "MIT"
description = "SACP-CBOR/1: strict deterministic CBOR validation and canonical encoding (hot-path optimized, no_std-capable)."
readme = "README.md"
keywords = ["cbor", "canonical", "deterministic", "no_std", "sacp"]
categories = ["encoding", "no-std"]

repository = "https://github.com/Synext-Solution/sacp-cbor"

[workspace]
members = ["sacp-cbor-derive", "sacp-cbor-abi", "sacp-cbor-abi-derive"]

[features]
# Default API for application use: std integration plus derive macros.
default = ["std", "derive"]

# Enable std integration (implements std::error::Error and enables allocation-backed APIs).
std = ["alloc"]

# Enable allocation-backed APIs (owned AST, canonical encoder, owned canonical bytes).
alloc = []

# Enable native collection implementations for Vec, BTreeMap, HashMap, and MapEntries.
collections = ["alloc"]

# Enable derive macros and the cbor_bytes! macro.
derive = ["alloc", "dep:sacp-cbor-derive"]

# Enable canonical CBOR editing and patch application.
edit = ["alloc"]

# Enable SHA-256 hashing helpers for canonical CBOR bytes.
sha2 = ["dep:sha2"]

# Enable serde-based conversions to/from canonical CBOR.
serde = ["alloc", "dep:serde"]

# Enable SIMD-accelerated UTF-8 validation where supported.
simdutf8 = ["dep:simdutf8"]

# Allow unchecked UTF-8 for canonical-trusted inputs (unsafe).
unsafe = []

[dependencies]
sha2 = { version = "0.10", default-features = false, optional = true }
serde = { version = "1", default-features = false, features = ["alloc", "derive"], optional = true }
sacp-cbor-derive = { path = "sacp-cbor-derive", version = "0.15.0", optional = true }
simdutf8 = { version = "0.1", default-features = false, optional = true }

[dev-dependencies]
proptest = "1"
serde_json = "1"
trybuild = "1"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }
