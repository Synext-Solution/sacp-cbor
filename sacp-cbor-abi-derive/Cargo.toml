[package]
name = "sacp-cbor-abi-derive"
version = "0.5.0"
edition = "2021"
rust-version = "1.75"
license = "MIT"
description = "Derive macros for sacp-cbor stable ABI schemas"
repository = "https://github.com/Synext-Solution/sacp-cbor"

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full", "extra-traits", "fold"] }
