[package]
name = "sacp-cbor-abi"
version = "0.9.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
description = "Stable ABI schema and codegen layer for sacp-cbor"
readme = "README.md"
repository = "https://github.com/Synext-Solution/sacp-cbor"

[features]
default = ["derive", "std"]
derive = ["dep:sacp-cbor-abi-derive"]
std = ["sacp-cbor/std"]

[dependencies]
sacp-cbor = { path = "..", version = "=0.18.2", default-features = false, features = ["alloc", "sha2"] }
sacp-cbor-abi-derive = { path = "../sacp-cbor-abi-derive", version = "=0.6.0", optional = true }
sha2 = { version = "0.11", default-features = false }

[dev-dependencies]
trybuild = "1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }
